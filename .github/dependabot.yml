# Adopted releases must be at least 7 days old (cooldown). Minor and patch
# updates are grouped per ecosystem so the open-PR limit never fills up;
# majors stay individual PRs and are merged by hand.
version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      bun-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Crypto and wire-format dependencies are supply-chain sensitive: routine
    # version updates are bumped by hand, never auto-merged. (`ignore` only
    # affects version updates; security updates still open PRs.) The auto-merge
    # sweep's only per-PR discriminator is labels and dependabot cannot label
    # per package, so `ignore` is the supported exclusion.
    ignore:
      - dependency-name: "@noble/*"
      - dependency-name: "@scure/*"
      - dependency-name: "@bufbuild/*"
      - dependency-name: "@connectrpc/*"
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    # Crypto crates are pinned to frost 3.0 / upstream spark-frost compatibility
    # and are supply-chain sensitive: every update type is bumped by hand
    # together with the upstream pin in scripts/lock.json, never auto-merged —
    # a patch-only hole would still reach auto-merge through the minor+patch
    # group. Security updates still open PRs.
    ignore:
      - dependency-name: "k256"
      - dependency-name: "sha2"
      - dependency-name: "hkdf"
      - dependency-name: "aes-gcm"
      - dependency-name: "rand_core"
      - dependency-name: "rand_chacha"
      - dependency-name: "vsss-rs"
      - dependency-name: "zeroize"
      - dependency-name: "frost-*"
  # The interop lockfile mirrors upstream; it is bumped only together with
  # scripts/lock.json, never by dependabot.
  - package-ecosystem: "cargo"
    directory: "/crates/interop"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
