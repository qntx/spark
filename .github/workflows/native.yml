name: Native

# Builds the prebuilt qntx_spark libraries @qntx/spark-native ships: the iOS
# QntxSpark.xcframework on macOS (xcodebuild + lipo) and the Android
# libqntx_spark.so jniLibs on Linux (NDK clang linkers). Both jobs verify the
# exported symbol lists and upload the artifacts; `bun run build:native`
# prints sizes and SHA-256 for SIZES.md.

on:
  # publish-npm.yml calls this workflow for release builds; the uploaded
  # artifacts are what `spark-native-prebuilt` is assembled from.
  workflow_call:
    inputs:
      release:
        description: >-
          Release build for a publish run: the shared rust cache is disabled (it
          is populated by untrusted PR jobs and could smuggle in code that ends
          up in published binaries). Build-provenance attestations live on the
          caller's native-artifact job, which attests the uploaded files there.
        required: false
        type: boolean
        default: false
  pull_request:
    paths:
      - "crates/**"
      - "packages/spark-native/**"
      - "scripts/build-native.ts"
      - "scripts/lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/native.yml"
  push:
    branches: [main]
    paths:
      - "crates/**"
      - "packages/spark-native/**"
      - "scripts/build-native.ts"
      - "scripts/lock.json"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/native.yml"

permissions:
  contents: read

concurrency:
  # Inside a workflow_call, github.workflow is the CALLER's name, so a
  # github.workflow-keyed group would land the called jobs in the caller's own
  # concurrency group and deadlock. Standalone runs dedupe per ref; calls get
  # a group unique to the calling run.
  group: ${{ github.workflow == 'Native' && format('native-{0}', github.ref) || format('native-call-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          targets: aarch64-apple-ios, aarch64-apple-ios-sim, x86_64-apple-ios
      # The shared cache can be poisoned by any PR job; release builds compile clean.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
      - run: bun install --frozen-lockfile
      - run: bun run build:native --ios
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: QntxSpark.xcframework
          path: packages/spark-native/ios/QntxSpark.xcframework

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: setup-ndk
        with:
          ndk-version: r27d
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99.1"
          targets: aarch64-linux-android, armv7-linux-androideabi, x86_64-linux-android, i686-linux-android
      # The shared cache can be poisoned by any PR job; release builds compile clean.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: ${{ !inputs.release }}
      - run: bun install --frozen-lockfile
      - run: bun run build:native --android
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: qntx-spark-jniLibs
          # include/ ships the generated qntx_spark.h copy; both paths sit
          # under packages/spark-native so the artifact keeps package-relative
          # layout for spark-native-prebuilt.
          path: |
            packages/spark-native/android/src/main/jniLibs
            packages/spark-native/include
