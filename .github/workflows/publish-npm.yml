# Real publish runs on `v*.*.*` tag pushes only (tag the release merge commit
# by hand; GITHUB_TOKEN tags do not trigger workflows). pull_request and manual
# workflow_dispatch always run the full pipeline with `npm publish --dry-run` —
# there is no manual path to a real publish.
name: Publish

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/publish-npm.yml"
      - ".github/workflows/native.yml"
      - "bump.config.ts"
      - "scripts/check-version.ts"
      - "packages/*/package.json"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  native:
    uses: ./.github/workflows/native.yml
    permissions:
      contents: read

  # On tag pushes, fails unless every package version equals the tag and the
  # tagged commit is an ancestor of origin/main. The called publish-npm
  # workflow skips versions already on the registry but does not check that
  # the tag matches package.json, so this job is the only guard against
  # publishing 1.x under a 2.x tag or a commit that never landed on main. On
  # PR/dispatch the check steps are skipped and the job succeeds so dependents
  # still run (as dry-runs).
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check tag matches package versions
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          fail=0
          for pkg in spark spark-wasm spark-native; do
            version="$(jq -r .version "packages/${pkg}/package.json")"
            if [ "v${version}" != "${REF_NAME}" ]; then
              echo "::error::packages/${pkg} declares version ${version} but the tag is ${REF_NAME} (expected v${version})"
              fail=1
            fi
          done
          [ "${fail}" -eq 0 ]
      - name: Check the tagged commit is on main
        if: github.event_name == 'push'
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor HEAD origin/main; then
            echo "::error::tag ${REF_NAME} points at a commit that is not an ancestor of origin/main"
            exit 1
          fi

  # Packages the iOS and Android native.yml artifacts into one upload-artifact
  # laid out relative to packages/spark-native — exactly the gitignored
  # entries of the package's `files` (the publish workflow downloads it into
  # the package directory).
  native-artifact:
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: QntxSpark.xcframework
          path: staging/ios/QntxSpark.xcframework
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: qntx-spark-jniLibs
          path: staging
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-native-prebuilt
          path: staging
          retention-days: 1

  # The checked-in spark.wasm (and its SRI integrity hash) is what publish
  # ships: rebuild it in the pinned linux/amd64 image and byte-compare, the
  # same check the CI wasm job runs, so a tag can never publish a module the
  # toolchain did not produce.
  wasm-reproducibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/spark-wasm build:wasm
      - run: git diff --exit-code packages/spark-wasm/src/spark.wasm packages/spark-wasm/src/integrity.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-wasm-rebuild
          path: packages/spark-wasm/src/spark.wasm

  spark:
    needs: [verify, native-artifact, wasm-reproducibility]
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      install-directory: .
      working-directory: packages/spark
      dry-run: ${{ github.event_name != 'push' }}

  spark-wasm:
    needs: [spark, wasm-reproducibility]
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      install-directory: .
      working-directory: packages/spark-wasm
      dry-run: ${{ github.event_name != 'push' }}

  spark-native:
    needs: [spark, native-artifact, wasm-reproducibility]
    uses: qntx/workflows/.github/workflows/publish-npm.yml@v2
    permissions:
      contents: read
      id-token: write
    with:
      package-manager: bun
      install-directory: .
      working-directory: packages/spark-native
      artifact: spark-native-prebuilt
      dry-run: ${{ github.event_name != 'push' }}
