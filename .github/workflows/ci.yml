name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: qntx/workflows/.github/workflows/ci-bun.yml@v2
    permissions:
      contents: read
    # bun run build → vp run -r build
    # bun run test → vp run -r test
    # test:parity runs in the dedicated `parity` job below: ci-bun has no
    # protoc for the upstream crate's build script.
    with:
      rust: true

  rust:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # rust-version omitted: rust-toolchain.toml pins the toolchain.
      deny: true
      doc: true

  rust-minimal:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      features: --no-default-features

  portable:
    uses: qntx/workflows/.github/workflows/ci-rust-cross.yml@v2
    permissions:
      contents: read
    with:
      targets: wasm32-unknown-unknown aarch64-linux-android armv7-linux-androideabi x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
      packages: spark-crypto spark-ffi
      forbid-deps: getrandom rayon

  interop:
    uses: qntx/workflows/.github/workflows/ci-rust.yml@v2
    permissions:
      contents: read
    with:
      # crates/interop is a standalone project; its rust-toolchain.toml pins
      # the toolchain and its deny.toml sits next to its Cargo.toml. The
      # upstream spark-frost build script needs protoc.
      working-directory: crates/interop
      apt-packages: protobuf-compiler
      deny: true
      doc: false

  # `bun run test:parity` without bun: the script body verbatim. The seeded
  # differential replays random FROST/ECIES/VSS inputs through the upstream
  # crate and spark-crypto.
  parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo test --release --test differential -- --ignored differential
        working-directory: crates/interop

  # Generated surfaces must be regenerated, not edited: synced protos and the
  # protobuf-es output are contracts (proto/spark/, src/proto/gen/).
  generated:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun scripts/sync-proto.ts --check
      - run: bun run gen:proto
      - run: git diff --exit-code packages/spark/src/proto/gen proto/
      # nitrogen/generated is committed: re-running the codegen must be a no-op.
      - run: bun run codegen
        working-directory: packages/spark-native
      - run: git diff --exit-code packages/spark-native/nitrogen

  # Generated surfaces must be regenerated, not edited: the committed header
  # is a contract (`qntx_spark.h`). proto regen is the `generated` job above.
  headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Version pinned in crates/spark-ffi/cbindgen.toml.
      - run: cargo install cbindgen --locked --version 0.29.4
      - run: cbindgen --config crates/spark-ffi/cbindgen.toml --output crates/spark-ffi/include/qntx_spark.h crates/spark-ffi
      - run: git diff --exit-code crates/spark-ffi/include/qntx_spark.h

  # spark.wasm and its SRI integrity hash are committed artifacts: rebuild and
  # diff so the checked-in bytes always come from the pinned toolchain. wasm32
  # codegen is host-dependent (x86_64-linux and aarch64-darwin rustc 1.99.1
  # emit different modules from identical sources), so build:wasm always runs
  # the pinned linux/amd64 image from packages/spark-wasm/scripts/Dockerfile —
  # on this runner and on developer machines alike (see SIZES.md).
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile
      - run: bun run --cwd packages/spark-wasm build:wasm
      - run: git diff --exit-code packages/spark-wasm/src/spark.wasm packages/spark-wasm/src/integrity.ts
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: spark-wasm-rebuild
          path: packages/spark-wasm/src/spark.wasm
      - run: bunx vp test
        working-directory: packages/spark-wasm

  # The C ABI must link and run from a plain system compiler: build the
  # staticlib release and drive the shared vectors through tests/host/main.c.
  ffi-host:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.99"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - run: bun run test:ffi-host
