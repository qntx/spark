name: lnurl-server image

# PRs touching the app or its packages build for linux/amd64 and run a smoke test against a
# postgres:17 service container. Tags v* build amd64+arm64, push ghcr.io/qntx/lnurl-server with
# SBOM + provenance attestations and cosign keyless signatures.
#
# Inlined rather than a shared qntx/workflows callee — same shape as facilitator/docker.yml.

on:
  pull_request:
    paths:
      - "apps/lnurl-server/**"
      - "packages/spark/**"
      - "packages/spark-wasm/**"
      - ".github/workflows/lnurl-server-image.yml"
      - "bun.lock"
      - ".dockerignore"
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lnurl-image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: qntx/lnurl-server

jobs:
  pg-tests:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lnurl
          POSTGRES_PASSWORD: lnurl
          POSTGRES_DB: lnurl
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"
      - run: bun install --frozen-lockfile
      - name: Real-Postgres concurrency tests
        env:
          LNURL_TEST_DATABASE_URL: postgres://lnurl:lnurl@127.0.0.1:5432/lnurl
        run: bunx vp test tests/store.pg.test.ts
        working-directory: apps/lnurl-server

  smoke:
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: lnurl
          POSTGRES_PASSWORD: lnurl
          POSTGRES_DB: lnurl
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.3.8"

      - run: bun install --frozen-lockfile

      - name: Build the consumed workspace packages
        run: |
          bun run --cwd packages/spark build
          bun run --cwd packages/spark-wasm build

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/lnurl-server/Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          sbom: false
          tags: lnurl-server:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run smoke test
        run: |
          SEED="$(openssl rand -hex 64)"
          ZAP_KEY="$(openssl rand -hex 32)"
          docker run -d --name lnurl -p 8080:8080 \
            -e LNURL_DOMAIN=localhost \
            -e LNURL_NETWORK=regtest \
            -e LNURL_SPARK_SEED="$SEED" \
            -e LNURL_ZAP_SECRET_KEY="$ZAP_KEY" \
            -e LNURL_DATABASE_URL="postgres://lnurl:lnurl@host.docker.internal:5432/lnurl" \
            --add-host=host.docker.internal:host-gateway \
            lnurl-server:ci
          bun apps/lnurl-server/scripts/smoke.ts
          docker stop lnurl
          docker logs lnurl > /tmp/lnurl.log
          grep -cv '"level":"info"' /tmp/lnurl.log || true

      - name: Readiness fails without Postgres
        run: |
          docker stop postgres || docker service stop postgres || true
          SEED2="$(openssl rand -hex 64)"
          docker run -d --name lnurl-down -p 8081:8080             -e LNURL_DOMAIN=localhost             -e LNURL_NETWORK=regtest             -e LNURL_SPARK_SEED="$SEED2"             -e LNURL_DATABASE_URL="postgres://lnurl:lnurl@host.docker.internal:1/lnurl"             --add-host=host.docker.internal:host-gateway             lnurl-server:ci
          sleep 15
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8081/ready)
          test "$code" = "503"

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: apps/lnurl-server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true

      - name: Generate artifact attestation
        if: steps.build.outputs.digest != ''
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Sign image with cosign
        if: steps.build.outputs.digest != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
        if: steps.build.outputs.digest != ''
