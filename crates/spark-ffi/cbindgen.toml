# cbindgen configuration for qntx_spark.h. Regenerate with:
#
#   cbindgen --config crates/spark-ffi/cbindgen.toml \
#     --output crates/spark-ffi/include/qntx_spark.h crates/spark-ffi
#
# Pinned cbindgen version: 0.29.4 (installed via `cargo install cbindgen
# --locked`); bump this comment together with the regenerated header.
language = "C"
# Emit the extern "C" guard — C++ consumers otherwise reference mangled
# symbols the C library does not export.
cpp_compat = true
header = """/*
 * qntx_spark.h — C ABI for the Spark cryptographic backend.
 * Generated by cbindgen. Do not edit by hand; see cbindgen.toml.
 * Error codes: 0 ok, 1 length, 2 invalid scalar, 3 invalid point,
 * 4 protobuf decode, 5 argument range, 6 frost, 7 auth, 8 internal.
 */"""
include_version = false
usize_is_size_t = true
no_includes = false
pragma_once = true

[export]
prefix = "qs_"

[fn]
rename_args = "SnakeCase"
