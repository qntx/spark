[package]
name         = "qntx-spark-interop"
publish      = false
description  = "Differential-test and vector-generation runner: replays shared inputs against the upstream spark-frost crate and the local spark-crypto."
version      = "0.0.0"
edition      = "2024"
rust-version = "1.99"
license      = "Apache-2.0"
repository   = "https://github.com/qntx/spark"
homepage     = "https://github.com/qntx/spark"
authors      = ["QNTX <https://qntx.org>"]

# Standalone project: excluded from the root workspace, own lockfile.
[workspace]

[lints.rust]
rust_2018_idioms        = { level = "deny", priority = -1 }
rust_2024_compatibility = { level = "warn", priority = -1 }
unused_must_use         = "deny"
unused_qualifications   = "warn"
non_ascii_idents        = "deny"
unsafe_code             = "forbid"

[lints.clippy]
correctness                     = { level = "deny", priority = -1 }
suspicious                      = { level = "deny", priority = -1 }
complexity                      = { level = "warn", priority = -1 }
perf                            = { level = "warn", priority = -1 }
style                           = { level = "warn", priority = -1 }
pedantic                        = { level = "warn", priority = -1 }
dbg_macro                       = "warn"
todo                            = "warn"
allow_attributes_without_reason = "warn"

[profile.test]
opt-level = 2
