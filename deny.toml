# cargo-deny configuration for the spark workspace.
#
# Run with `cargo deny check` to enforce supply-chain hygiene:
# - advisories: every transitive dependency must be free of known CVEs
# - bans:       the workspace ships exactly one version of every crate
# - licenses:   only permissive licenses are allowed
# - sources:    crates.io plus the two pinned upstream git repositories below

[graph]
all-features        = true
no-default-features = false

[output]
feature-depth = 1

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
yanked  = "deny"
ignore  = []

[licenses]
allow                = ["MIT", "MIT-0", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "BSL-1.0", "ISC", "Unicode-3.0", "Unicode-DFS-2016", "Zlib", "CC0-1.0"]
confidence-threshold = 0.93
exceptions           = []

[bans]
multiple-versions = "warn"
wildcards         = "deny"
highlight         = "all"
allow             = []
deny              = []
skip              = []
skip-tree         = []

[sources]
unknown-registry = "deny"
unknown-git      = "deny"
allow-registry   = ["https://github.com/rust-lang/crates.io-index"]
allow-git        = ["https://github.com/lightsparkdev/frost", "https://github.com/buildonspark/spark"]
